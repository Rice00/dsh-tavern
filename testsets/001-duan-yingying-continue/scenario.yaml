name: 001 段莹莹_自由 · 自由模式 · 三轮继续
model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: high
timeoutMs: 300000
tavernSettings:
  backgroundTasks:
    posture: true
    variables: true
    characterDesign: false
steps:
  - action: play
    card: ./card.json
    cardName: 段莹莹
    expect:
      state:
        - path: mode
          equals: story
        - path: requestMode
          equals: dsh
  - action: say
    input: 继续
    expect:
      refused: false
      minChars: 1
      state:
        - path: settleStatus
          equals: done
  - action: say
    input: 继续，承接上一轮的情节。
    expect:
      refused: false
      minChars: 1
      backgroundRequired: true
  - action: say
    input: 继续，保持人物与事件的连续性。
    expect:
      refused: false
      minChars: 1
      backgroundRequired: true
